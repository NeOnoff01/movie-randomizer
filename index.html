<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Losowy Film</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🍿 Co dzisiaj oglądamy?</h1>
            <p>Wybierz gatunek i zdaj się na ślepy los!</p>
        </header>

        <main>
            <div class="controls">
                <select id="genreSelect">
                    <option value="">Ładowanie gatunków...</option>
                </select>
                <button id="randomizeBtn">Wylosuj film</button>
            </div>

            <div id="loader" class="hidden">Losowanie...</div>

            <div id="movieResult" class="movie-card hidden">
                <img src="https://placehold.co/300x450/444444/ffffff?text=Plakat+Filmu" alt="Plakat filmu" id="moviePoster">
                <div class="movie-info">
                    <h2 id="movieTitle">Tytuł Filmu</h2>
                    <p><strong>Ocena:</strong> <span id="movieRating">8.5</span>/10</p>
                    <p id="movieDescription">Tutaj pojawi się krótki opis wylosowanego filmu...</p>
                </div>
            </div>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
